name: Release Flutter SDK

# Dispatched by release-mobile.yml after it creates the flutter/v* tag.
# Running under that tag ref ensures the OIDC token carries refs/tags/flutter/v*,
# which matches the trusted-publishing tag pattern configured on pub.dev.
on:
  workflow_dispatch:

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions: {}

jobs:
  publish-flutter:
    name: Publish Flutter
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
    defaults:
      run:
        working-directory: packages/flutter

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.ref }}
          token: ${{ secrets.QUILTTY_RELEASE_GITHUB_TOKEN }}

      - name: Validate ref is a flutter/v* tag
        run: |
          case "$GITHUB_REF" in
            refs/tags/flutter/v*) ;;
            *)
              echo "ERROR: This workflow must run against a flutter/v* tag ref (got: $GITHUB_REF)"
              echo "Dispatch via release-mobile.yml, or select a flutter/v* tag from the 'Use workflow from' dropdown."
              exit 1
              ;;
          esac

      - name: Extract version from tag
        id: version
        run: |
          VERSION="${GITHUB_REF#refs/tags/flutter/v}"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Releasing Flutter SDK v$VERSION"

      - uses: ./.github/actions/setup-flutter

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze lib

      - name: Validate package
        run: dart pub publish --dry-run

      - name: Check if version already published
        id: check_published
        run: |
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            "https://pub.dev/packages/quiltt_connector/versions/${{ steps.version.outputs.version }}.json")
          if [ "$HTTP_STATUS" = "200" ]; then
            echo "Version ${{ steps.version.outputs.version }} already published to pub.dev, skipping"
            echo "already_published=true" >> $GITHUB_OUTPUT
          else
            echo "already_published=false" >> $GITHUB_OUTPUT
          fi

      - name: Publish to pub.dev
        if: steps.check_published.outputs.already_published != 'true'
        run: dart pub publish --force

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "flutter/v${{ steps.version.outputs.version }}"
          name: "Flutter SDK v${{ steps.version.outputs.version }}"
          body: |
            ## Flutter SDK v${{ steps.version.outputs.version }}

            ### Installation

            ```yaml
            dependencies:
              quiltt_connector: ^${{ steps.version.outputs.version }}
            ```

            Published to [pub.dev](https://pub.dev/packages/quiltt_connector).
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
