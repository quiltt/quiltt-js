name: Unit Tests

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read
  checks: write
  statuses: write
  actions: write

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout branch
        uses: actions/checkout@v6

      - name: Setup environment
        uses: ./.github/actions/setup-js

      - name: Run unit tests with coverage
        run: pnpm run test:unit

      - name: Upload coverage to Qlty
        if: always()
        uses: qltysh/qlty-action/coverage@v2
        with:
          token: ${{ secrets.QLTY_COVERAGE_TOKEN }}
          files: coverage/lcov.info
          format: lcov
          incomplete: true

  test-android-unit:
    name: Android Unit Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/android

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v4
        with:
          distribution: corretto
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests with coverage
        run: ./gradlew connector:testDebugUnitTest connector:createDebugUnitTestCoverageReport

      - name: Upload coverage to Qlty
        if: always()
        uses: qltysh/qlty-action/coverage@v2
        with:
          token: ${{ secrets.QLTY_COVERAGE_TOKEN }}
          files: packages/android/connector/build/reports/coverage/test/debug/report.xml
          format: jacoco
          add-prefix: packages/android/connector/src/main/java/
          incomplete: true

  test-flutter-unit:
    name: Flutter Unit Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/flutter

    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/setup-flutter

      - name: Install dependencies
        run: flutter pub get

      - name: Run library unit tests with coverage
        run: flutter test --coverage

      - name: Upload coverage to Qlty
        if: always()
        uses: qltysh/qlty-action/coverage@v2
        with:
          token: ${{ secrets.QLTY_COVERAGE_TOKEN }}
          files: packages/flutter/coverage/lcov.info
          format: lcov
          add-prefix: packages/flutter/
          incomplete: true

  test-ios-unit:
    name: iOS Unit Tests
    runs-on: macos-14

    steps:
      - uses: actions/checkout@v6

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "16.2"

      - name: Run tests with coverage
        working-directory: .
        run: swift test --enable-code-coverage

      - name: Generate lcov coverage report
        working-directory: .
        run: |
          BINARY=$(find .build -name "*PackageTests" -not -path "*checkouts*" -not -path "*.dSYM*" | head -1)
          PROFDATA=$(find .build -name "*.profdata" -not -path "*checkouts*" 2>/dev/null | head -1)
          if [ -n "$BINARY" ] && [ -n "$PROFDATA" ]; then
            mkdir -p packages/ios/coverage
            xcrun llvm-cov export "$BINARY" \
              -instr-profile "$PROFDATA" \
              -format lcov \
              --ignore-filename-regex='.*\.build.*|.*Tests.*' \
              > packages/ios/coverage/lcov.info
            echo "Coverage report generated at packages/ios/coverage/lcov.info"
          else
            echo "Error: could not find binary ($BINARY) or profdata ($PROFDATA)"
            exit 1
          fi

      - name: Verify lcov coverage report
        working-directory: .
        run: |
          if [ ! -s packages/ios/coverage/lcov.info ]; then
            echo "Error: packages/ios/coverage/lcov.info is missing or empty"
            exit 1
          fi
          echo "lcov.info size: $(wc -c < packages/ios/coverage/lcov.info) bytes"

      - name: Upload coverage to Qlty
        if: always()
        uses: qltysh/qlty-action/coverage@v2
        with:
          token: ${{ secrets.QLTY_COVERAGE_TOKEN }}
          files: packages/ios/coverage/lcov.info
          format: lcov
          incomplete: true

  coverage-complete:
    name: Coverage Complete
    runs-on: ubuntu-latest
    needs: [test, test-android-unit, test-flutter-unit, test-ios-unit]
    if: always()
    steps:
      - name: Signal coverage complete to Qlty
        uses: qltysh/qlty-action/coverage@v2
        with:
          token: ${{ secrets.QLTY_COVERAGE_TOKEN }}
          command: complete
