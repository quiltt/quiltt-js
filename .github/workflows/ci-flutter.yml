name: Flutter CI

on:
  push:
    branches:
      - main
    paths:
      - "packages/flutter/**"
  pull_request:
    paths:
      - "packages/flutter/**"
      - ".github/workflows/ci-flutter.yml"
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: packages/flutter

jobs:
  build:
    name: "Flutter ${{ matrix.flutter-version }} CI"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        flutter-version: ["3.41.4", "3.27.4"] # current stable; update older version as needed

    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/setup-flutter
        with:
          flutter-version: ${{ matrix.flutter-version }}

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze lib

      - name: Check publish readiness
        run: flutter pub publish --dry-run
